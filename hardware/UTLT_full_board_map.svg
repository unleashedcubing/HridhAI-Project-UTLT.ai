<text x="52" y="866" fill="#122033" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="600">White VIN and black GPIO27 leads use cut male pins beside the header pins: temporary contact; replace for the demo.</text>
<text x="52" y="898" fill="#A33928" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="600">Only move the converter with both boards unplugged. Never connect a possible 5 V sensor signal directly to GPIO27.</text>
<text x="52" y="929" fill="#53657A" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="600">Pump is separate; run the submersible pump only with its inlet under water. Keep breadboard and USB dry.</text>
