<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="UTLT.ai helps your family track daily water use, stay within your goal and save water in Hyderabad.">
  <meta name="theme-color" content="#12171d">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="UTLT.ai">
  <meta name="format-detection" content="telephone=no">
  <title>UTLT.ai · Smart water tracking</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%92%A7%3C/text%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap">
  <!-- Tiny inline style so the loading screen looks right before styles.css arrives -->
  <style>
    html, body { margin: 0; background: #12171d; }
    .utlt-splash { display: grid; min-height: 100dvh; place-content: center; justify-items: center; gap: 14px; color: #9fb0c3; font: 600 14px/1.4 -apple-system, "Segoe UI", Roboto, Arial, sans-serif; }
    .utlt-splash span { display: grid; width: 72px; height: 72px; place-items: center; border-radius: 22px; background: linear-gradient(135deg, #2a9bff, #00c3d0); font-size: 34px; box-shadow: 0 16px 36px -10px rgba(22, 136, 248, .7); animation: utlt-splash-pulse 1.4s ease-in-out infinite; }
    @keyframes utlt-splash-pulse { 50% { transform: scale(.92); opacity: .8; } }
    @media (prefers-reduced-motion: reduce) { .utlt-splash span { animation: none; } }
  </style>
  <link rel="stylesheet" href="./styles.css?v=ui-polish-2">
  <script defer src="./data.js?v=ui-polish-2"></script>
  <script defer src="./app.js?v=ui-polish-2"></script>
</head>
<body>
  <!-- The app replaces this loading screen as soon as it starts -->
  <div id="app"><div class="utlt-splash" role="status"><span aria-hidden="true">💧</span>Loading UTLT.ai…</div></div>
  <noscript>
    <p style="margin:0;padding:24px;font:16px/1.5 Arial,sans-serif;color:#f1f5f9;background:#12171d;">UTLT.ai needs JavaScript to show your water dashboard. Please turn JavaScript on in your browser settings and reload this page.</p>
  </noscript>
</body>
</html>
